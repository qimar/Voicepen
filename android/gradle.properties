# Limit Gradle memory to prevent Out of Memory (OOM) crashes on 8GB RAM machines
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Disable Kotlin incremental compilation to prevent multi-drive root crash on Windows
kotlin.incremental=false
